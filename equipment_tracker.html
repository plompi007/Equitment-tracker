<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>מעקב ציוד</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap');
:root {
  --bg:#f0f2f5;--s1:#ffffff;--s2:#ffffff;--s3:#f8f9fb;
  --border:#e2e6ec;--border2:#eaedf2;
  --accent:#2563eb;--accent-dim:rgba(37,99,235,.1);
  --green:#16a34a;--green-dim:rgba(22,163,74,.1);
  --yellow:#d97706;--yellow-dim:rgba(217,119,6,.1);
  --red:#dc2626;--red-dim:rgba(220,38,38,.1);
  --text:#111827;--text2:#6b7280;--text3:#9ca3af;
  --gold:#b8912f;--gold-dim:rgba(184,145,47,.12);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Heebo',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100dvh}

.hdr{flex-shrink:0;background:var(--s1);border-bottom:2px solid var(--gold);box-shadow:0 1px 6px rgba(0,0,0,.06);padding:10px 14px;display:flex;align-items:center;gap:10px}
.hdr-logo{width:34px;height:34px;border-radius:50%;object-fit:cover;border:1.5px solid var(--gold);flex-shrink:0}
.hdr-title{font-size:16px;font-weight:800;flex:1}
.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.pill-out{background:var(--yellow-dim);color:var(--yellow)}
.pill-fault{background:var(--red-dim);color:var(--red)}

.tabs{flex-shrink:0;display:flex;background:var(--s1);border-bottom:1px solid var(--border2);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:10px 16px;font:600 13px/1 'Heebo',sans-serif;color:var(--text2);cursor:pointer;border:none;border-bottom:2px solid transparent;background:none;transition:all .15s}
.tab.on{color:var(--gold);border-bottom-color:var(--gold);border-bottom-width:3px;font-weight:800}

.body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.page{display:none;padding:12px}
.page.on{display:block}

.sum-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.sum-card{background:var(--s1);border:1px solid var(--border2);border-radius:10px;padding:10px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.sum-num{font-size:24px;font-weight:900;line-height:1;margin-bottom:2px}
.sum-lbl{font-size:10px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}

.search-box{width:100%;background:var(--s1);border:1px solid var(--border2);border-radius:9px;padding:9px 12px;color:var(--text);font:500 14px/1 'Heebo',sans-serif;outline:none;margin-bottom:10px}
.search-box::placeholder{color:var(--text3)}
.search-box:focus{border-color:var(--accent)}

.cat-hdr{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);padding:4px 0 7px;margin-top:6px;border-bottom:1px solid var(--border2);margin-bottom:6px;display:flex;align-items:center;justify-content:space-between}

.item-row{display:flex;align-items:center;background:var(--s1);border:1px solid var(--border2);border-radius:9px;padding:10px 12px;margin-bottom:6px;gap:10px;cursor:pointer;transition:all .12s;position:relative;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.item-row::before{content:'';position:absolute;right:0;top:0;bottom:0;width:3px;border-radius:0 9px 9px 0}
.item-row.base::before{background:var(--green)}
.item-row.out::before{background:var(--yellow)}
.item-row.fault::before{background:var(--red)}
.item-row:active{transform:scale(.98)}
.item-id{font-size:14px;font-weight:800;flex:1;letter-spacing:.3px}
.item-where{font-size:12px;color:var(--text2);flex:1;text-align:left}
.item-badge{font-size:10px;font-weight:700;padding:3px 7px;border-radius:6px}
.b-base{background:var(--green-dim);color:var(--green)}
.b-out{background:var(--yellow-dim);color:var(--yellow)}
.b-fault{background:var(--red-dim);color:var(--red)}

.log-row{background:var(--s1);border:1px solid var(--border2);border-radius:9px;padding:10px 12px;margin-bottom:6px}
.log-top{display:flex;justify-content:space-between;margin-bottom:4px}
.log-id{font-size:14px;font-weight:700}
.log-ts{font-size:11px;color:var(--text3)}
.log-sub{font-size:12px;color:var(--text2);line-height:1.6}
.log-badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;margin-right:4px}
.lb-out{background:var(--yellow-dim);color:var(--yellow)}
.lb-in{background:var(--green-dim);color:var(--green)}
.lb-fault{background:var(--red-dim);color:var(--red)}

.empty{text-align:center;padding:40px 16px;color:var(--text3);font-size:13px}

.fab-wrap{flex-shrink:0;padding:10px 14px 16px;background:var(--bg);border-top:1px solid var(--border2)}
.fab{width:100%;padding:14px;background:var(--accent);color:#fff;border:none;border-top:3px solid var(--gold);border-radius:12px;font:700 15px/1 'Heebo',sans-serif;cursor:pointer;transition:opacity .15s;box-shadow:0 2px 10px rgba(37,99,235,.25)}
.fab:active{opacity:.85}

/* SHEET */
.sheet-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:flex-end;justify-content:center}
.sheet-bg.on{display:flex}
.sheet{background:var(--s2);border:1px solid var(--border);border-radius:20px 20px 0 0;width:100%;max-width:540px;padding:16px 14px 28px;max-height:92dvh;overflow-y:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
.sheet-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 14px}
.sheet-title{font-size:17px;font-weight:800;margin-bottom:14px}

.steps{display:flex;gap:6px;margin-bottom:18px}
.step-dot{height:3px;border-radius:3px;flex:1;background:var(--border);transition:background .2s}
.step-dot.done{background:var(--accent)}

.slabel{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text2);margin-bottom:8px;display:block}

.person-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:12px}
.person-btn{padding:11px 6px;border-radius:9px;border:1.5px solid var(--border);background:var(--s1);color:var(--text2);font:600 13px/1 'Heebo',sans-serif;cursor:pointer;text-align:center;transition:all .12s}
.person-btn.on{border-color:var(--accent);background:var(--accent-dim);color:var(--accent)}
.person-other{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:9px;padding:10px 12px;color:var(--text);font:500 14px/1 'Heebo',sans-serif;outline:none;transition:border-color .2s;margin-bottom:14px}
.person-other:focus{border-color:var(--accent)}
.person-other::placeholder{color:var(--text3)}

.cat-check-hdr{font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--text3);padding:6px 0;margin-top:8px;border-bottom:1px solid var(--border2);display:flex;align-items:center;justify-content:space-between}
.cat-check-hdr button{font:600 11px/1 'Heebo',sans-serif;color:var(--accent);background:none;border:none;cursor:pointer}
.check-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:4px}
.check-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1.5px solid var(--border2);border-radius:9px;cursor:pointer;background:var(--s1);transition:all .12s}
.check-item.on{border-color:var(--accent);background:var(--accent-dim)}
.check-item:active{transform:scale(.97)}
.check-box{width:20px;height:20px;border-radius:5px;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .12s}
.check-box.on{background:var(--accent);border-color:var(--accent)}
.check-box.on::after{content:'✓';color:#fff;font-size:12px;font-weight:700}
.check-lbl{font-size:13px;font-weight:700;flex:1;line-height:1.2}
.check-sub{font-size:10px;color:var(--accent);font-weight:600}

.cond-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.cond-btn{padding:11px;border-radius:9px;border:1.5px solid var(--border);background:var(--s1);color:var(--text2);font:700 13px/1 'Heebo',sans-serif;cursor:pointer;text-align:center;transition:all .12s}
.cond-btn.ok-on{border-color:var(--green);background:var(--green-dim);color:var(--green)}
.cond-btn.fault-on{border-color:var(--red);background:var(--red-dim);color:var(--red)}

.fault-field,textarea{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:9px;padding:10px 12px;color:var(--text);font:500 14px/1.5 'Heebo',sans-serif;outline:none;resize:none;height:66px;margin-bottom:14px}
.fault-field{display:none}
.fault-field.on{display:block}
.fault-field:focus,textarea:focus{border-color:var(--red)}
textarea.notes{border-color:var(--border);margin-bottom:16px}
textarea.notes:focus{border-color:var(--accent)}

.next-btn{width:100%;padding:14px;background:var(--accent);color:#fff;border:none;border-radius:11px;font:700 15px/1 'Heebo',sans-serif;cursor:pointer;transition:opacity .15s}
.next-btn:active{opacity:.85}
.next-btn:disabled{opacity:.35;cursor:default}
.back-btn{width:100%;padding:11px;margin-top:7px;background:none;color:var(--text2);border:1px solid var(--border);border-radius:11px;font:600 13px/1 'Heebo',sans-serif;cursor:pointer}
.day-section{background:var(--s1);border:1px solid var(--border2);border-radius:10px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.day-section-title{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text2);margin-bottom:10px}
.qty-row{display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border2)}
.qty-row:last-child{border-bottom:none}
.qty-label{font-size:14px;font-weight:600;flex:1}
.qty-progress{font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;margin-right:8px}
.qty-ok{background:var(--green-dim);color:var(--green)}
.qty-warn{background:var(--yellow-dim);color:var(--yellow)}
.qty-over{background:var(--red-dim);color:var(--red)}
.task-item{display:flex;align-items:flex-start;gap:10px;padding:9px 4px;border-bottom:1px solid var(--border2);cursor:pointer}
.task-item:last-child{border-bottom:none}
.task-check{width:22px;height:22px;border-radius:6px;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:1px;transition:all .12s}
.task-check.done{background:var(--green);border-color:var(--green)}
.task-check.done::after{content:'✓';color:#fff;font-size:12px;font-weight:700}
.task-text{font-size:14px;flex:1;line-height:1.4}
.task-text.done{text-decoration:line-through;color:var(--text3)}
.station-badge{display:inline-block;background:var(--accent-dim);color:var(--accent);font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;margin:3px 3px 3px 0}
</style>

const FORCE_BOTTOM_IDS=new Set(['M-2888','M-2737','M-2915','M-2596','M-2695']);
function sortCategoryItems(cat){
  const idx=[], items=[];
  ITEMS.forEach((item,i)=>{ if(item.cat===cat){idx.push(i);items.push(item);} });
  items.sort((a,b)=>{
    const fa=FORCE_BOTTOM_IDS.has(a.id), fb=FORCE_BOTTOM_IDS.has(b.id);
    if(fa!==fb) return fa?1:-1;
    const na=parseFloat(a.id.replace(/[^\d.]/g,''))||0;
    const nb=parseFloat(b.id.replace(/[^\d.]/g,''))||0;
    return na-nb;
  });
  idx.forEach((pos,i)=>ITEMS[pos]=items[i]);
}

function addCustomItemToInventory(name,qty,cat){
  const ids=[];
  if(qty<=1){
    ids.push(name);
  } else {
    for(let i=1;i<=qty;i++) ids.push(name+' '+i);
  }
  ids.forEach(id=>{
    if(!ITEMS.some(it=>it.id===id)) ITEMS.push({id,cat,custom:true});
    if(!db.items) db.items={};
    if(!db.items[id]) db.items[id]={status:'base',where:'',ts:'',notes:'',faultDesc:''};
  });
  sortCategoryItems(cat);
  return ids;
}

// סנכרון פריטים מותאמים אישית שנטענו מה-DB (Firebase/localStorage) לתוך מערך ה-ITEMS בפועל
function syncCustomItemsIntoItems(){
  (db.customItems||[]).forEach(ci=>{
    let ids=ci.ids;
    if(!ids||!ids.length){
      ids = ci.qty>1 ? Array.from({length:ci.qty},(_,i)=>ci.name+' '+(i+1)) : [ci.name];
      ci.ids=ids;
    }
    ids.forEach(id=>{
      if(!ITEMS.some(it=>it.id===id)) ITEMS.push({id,cat:ci.cat,custom:true});
      if(!db.items) db.items={};
      if(!db.items[id]) db.items[id]={status:'base',where:'',ts:'',notes:'',faultDesc:''};
    });
    sortCategoryItems(ci.cat);
  });
}

function save(){

function attemptFirebaseSave(){
  function showSaveError(){
    const st=document.getElementById('sync-status');
    if(st){st.textContent='🔴 לא נשמר - מנסה שוב...';st.style.color='var(--red)';}
    if(saveRetryTimer) clearTimeout(saveRetryTimer);
    saveRetryTimer=setTimeout(attemptFirebaseSave,4000);
  }
  function showSaveOk(){
    pendingWrite=false;
    if(saveRetryTimer){clearTimeout(saveRetryTimer);saveRetryTimer=null;}
    const st=document.getElementById('sync-status');
    if(st){st.textContent='🟢 מחובר';st.style.color='var(--green)';}
  }
  try{
    if(fbRef){
      const res=fbRef.set(db);
      if(res&&res.then) res.then(showSaveOk).catch(showSaveError);
      else pendingWrite=false;
    } else {
      showSaveError();
    }
  }catch(e){ showSaveError(); }
}

  if(F.pelicanContents) delete F.pelicanContents[id];
  if(F.pelicanReturnIssues) delete F.pelicanReturnIssues[id];
  const partner=getPartner(id);
  if(partner) F.items=F.items.filter(x=>x!==partner);
}

// ── תוכן פליקן (רחפנים בפנים) ──
const PELICAN_DRONE_CATS=['רחפן עטלף 5','רחפן עטלף 7"','רחפן עטלף 10"'];

function openPelicanContentPicker(pelicanId){
  if(!F.pelicanContents) F.pelicanContents={};
  if(!F.pelicanContents[pelicanId]) F.pelicanContents[pelicanId]={ids:[]};
  const chosen=F.pelicanContents[pelicanId].ids;
  const el=document.getElementById('sheet-content');
  if(!el) return;
  let html=`<div class="sheet-title">מה בפנים ${pelicanId}?</div>
  <div style="font-size:11px;color:var(--accent);margin-bottom:12px;background:var(--accent-dim);padding:7px 10px;border-radius:8px;font-weight:600">בחר את הרחפנים הספציפיים שנמצאים בפליקן</div>`;
  PELICAN_DRONE_CATS.forEach(cat=>{
    const avail=ITEMS.filter(i=>i.cat===cat&&db.items[i.id]&&(db.items[i.id].status==='base'||chosen.includes(i.id))&&!db.items[i.id].worn);
    if(!avail.length) return;
    html+=`<div class="cat-check-hdr"><span>${cat}</span></div><div class="check-grid">`;
    avail.forEach(item=>{
      const on=chosen.includes(item.id);
      const safeId=escId(item.id);
      const safePid=escId(pelicanId);
      html+=`<div class="check-item${on?' on':''}" onclick="togglePelicanDrone('${safePid}','${safeId}')">
        <div class="check-box${on?' on':''}"></div>
        <div style="flex:1"><div class="check-lbl">${colorDot(item)}${item.id}</div></div>
      </div>`;
    });
    html+=`</div>`;
  });
  html+=`<div style="font-size:13px;color:var(--accent);margin:8px 0 4px;font-weight:700">✓ נבחרו ${chosen.length} רחפנים</div>
  <button class="next-btn" style="margin-top:6px" onclick="confirmPelicanContents()">אישור תוכן — חזרה לרשימת הפריטים</button>
  <button class="back-btn" style="margin-top:8px;color:var(--red);border-color:var(--red)" onclick="removeFromSelection('${escId(pelicanId)}');renderStep()">✕ הסר את ${pelicanId} מההעמסה</button>`;
  el.innerHTML=html;
}
function togglePelicanDrone(pelicanId,droneId){
  if(!F.pelicanContents) F.pelicanContents={};
  if(!F.pelicanContents[pelicanId]) F.pelicanContents[pelicanId]={ids:[]};
  const arr=F.pelicanContents[pelicanId].ids;
  const idx=arr.indexOf(droneId);
  if(idx>=0) arr.splice(idx,1); else arr.push(droneId);
  openPelicanContentPicker(pelicanId);
}
function confirmPelicanContents(){
  renderStep();
}
function pelicanHasEmptySelection(){
  if(!F.pelicanContents) return null;
  for(const pid of Object.keys(F.pelicanContents)){
    if(F.items.includes(pid)&&(!F.pelicanContents[pid].ids||!F.pelicanContents[pid].ids.length)) return pid;
  }
  return null;
}

// ── בדיקת החזרת פליקן ──
function openPelicanReturnCheck(pelicanId){
  const prev=db.items[pelicanId]&&db.items[pelicanId].contents;
  const ids=(prev&&prev.ids)||[];
  if(!F.pelicanReturnOk) F.pelicanReturnOk={};
  if(!F.pelicanReturnOk[pelicanId]) F.pelicanReturnOk[pelicanId]=[...ids];
  const okList=F.pelicanReturnOk[pelicanId];
  const el=document.getElementById('sheet-content');
  if(!el) return;
  let html=`<div class="sheet-title">מה חוזר ב-${pelicanId}?</div>
  <div style="font-size:11px;color:var(--accent);margin-bottom:12px;background:var(--accent-dim);padding:7px 10px;border-radius:8px;font-weight:600">כל הרחפנים מסומנים כברירת מחדל כחוזרים תקין. בטל סימון לרחפן שחסר/ניזוק</div>
  <div class="check-grid">`;
  ids.forEach(droneId=>{
    const item=ITEMS.find(i=>i.id===droneId)||{id:droneId};
    const on=okList.includes(droneId);
    const safeId=escId(droneId);
    const safePid=escId(pelicanId);
    const issue=(F.pelicanReturnIssues&&F.pelicanReturnIssues[pelicanId]&&F.pelicanReturnIssues[pelicanId][droneId])||'';
    html+=`<div class="check-item${on?' on':''}" onclick="togglePelicanReturnItem('${safePid}','${safeId}')">
      <div class="check-box${on?' on':''}"></div>
      <div style="flex:1"><div class="check-lbl">${colorDot(item)}${droneId}</div>${issue?`<div style="font-size:10px;color:var(--red)">${issue}</div>`:''}</div>
    </div>`;
  });
  html+=`</div>
  <button class="next-btn" style="margin-top:12px" onclick="confirmPelicanReturn()">אישור</button>`;
  el.innerHTML=html;
}
function togglePelicanReturnItem(pelicanId,droneId){
  const okList=F.pelicanReturnOk[pelicanId];
  const idx=okList.indexOf(droneId);
  if(idx>=0){
    okList.splice(idx,1);
    const dmg=prompt('מה קרה ל-'+droneId+'? (חסר / ניזוק — פרט)')||'';
    if(!F.pelicanReturnIssues) F.pelicanReturnIssues={};
    if(!F.pelicanReturnIssues[pelicanId]) F.pelicanReturnIssues[pelicanId]={};
    F.pelicanReturnIssues[pelicanId][droneId]=dmg;
  } else {
    okList.push(droneId);
    if(F.pelicanReturnIssues&&F.pelicanReturnIssues[pelicanId]) delete F.pelicanReturnIssues[pelicanId][droneId];
  }
  openPelicanReturnCheck(pelicanId);
}
function confirmPelicanReturn(){
  renderStep();
}

// ── FLOW ──
let F={action:'dispatch',person:'',items:[],cond:'ok',itemCond:{},transferDest:'',itemQty:{}};
let step=0;
const STEPS_DISPATCH=3, STEPS_RETURN=2;

function startFlow(preItem,preAction){
  F={action:preAction||'dispatch',person:'',items:preItem?[preItem]:[],cond:'ok',itemCond:{},transferDest:'',itemQty:{},multiDest:false,itemDest:{},destSelection:[]};
  step=preItem?(preAction==='return'?1:1):0;
  openSheet();
}
function openSheet(){
  updateDots();
  renderStep();
  document.getElementById('sheet-bg').classList.add('on');
}
function bgClose(e){
  if(e.target===document.getElementById('sheet-bg')) closeSheet();
  else e.stopPropagation();
}
function closeSheet(){document.getElementById('sheet-bg').classList.remove('on');}

function updateDots(){
  const total=F.action==='dispatch'?STEPS_DISPATCH:STEPS_RETURN;
  for(let i=0;i<3;i++) document.getElementById('d'+i).className='step-dot'+(i<=step?i<step+1?' done':'':'');
  // fill completed
  for(let i=0;i<3;i++) document.getElementById('d'+i).className='step-dot'+(i<step+1?' done':'');
}

function renderStep(){
  updateDots();
  const el=document.getElementById('sheet-content');
  try {
  if(F.action==='transfer'){
    if(step===0) el.innerHTML=stepAction();
    else if(step===1) el.innerHTML=stepPerson();
    else if(step===2) el.innerHTML=stepTransferFromItems();
    else if(step===3) el.innerHTML=stepTransferDest();
    else if(step===4) el.innerHTML=stepReview();
  } else if(F.action==='dispatch'){
    if(step===0) el.innerHTML=stepAction();
    else if(step===1) el.innerHTML=stepPerson();
    else if(step===2) el.innerHTML=stepItems();
    else if(step===3) el.innerHTML = F.multiDest ? stepAssignDest() : stepReview();
    else if(step===4) el.innerHTML=stepReview();
  } else {
    if(step===0) el.innerHTML=stepAction();
    else if(step===1) el.innerHTML=stepReturnItems();
    else if(step===2) el.innerHTML=stepReview();
  }

  // כפתור המשך צף
  const floatWrap=document.getElementById('float-next-wrap');
  if(floatWrap){
    const showFloat=(F.action==='dispatch'&&step===2)||(F.action==='return'&&step===1)||(F.action==='transfer'&&step===2);
    if(showFloat){
      const n=F.items.length;
      floatWrap.style.display='block';
      document.getElementById('float-next-btn').textContent=n?`שמור (${n} פריטים)`:'בחר פריטים';
      document.getElementById('float-next-btn').disabled=!n;
    } else {
      floatWrap.style.display='none';
    }
  }
  attachListeners();
  } catch(e) {
    el.innerHTML=`<div style="padding:20px;color:red;font-size:13px">שגיאה בשלב ${step}: ${e.message}</div><button class="back-btn" onclick="step=0;renderStep()">חזרה לתחילה</button>`;
  }
}

function addFreeEntry(){
  const inp=document.getElementById('free-entry-inp');
  if(!inp) return;
  const val=inp.value.trim();
  if(!val) return;
  const freeId='חופשי:'+val;
  if(!F.items.includes(freeId)) F.items.push(freeId);
  inp.value='';
  // הצג ברשימה
  const list=document.getElementById('free-entries-list');
  if(list){
    const el=document.createElement('div');
    el.style.cssText='display:flex;align-items:center;justify-content:space-between;padding:6px 4px;border-bottom:1px solid var(--border2)';
    el.innerHTML=`<span style="font-size:13px;font-weight:600">${val}</span><button onclick="removeFreeEntry('${escId(freeId)}',this.parentElement)" style="background:none;border:none;color:var(--red);font-size:16px;cursor:pointer">✕</button>`;
    list.appendChild(el);
  }
  const btn=document.getElementById('float-next-btn');
  if(btn){btn.disabled=false;btn.textContent='שמור ('+F.items.length+' פריטים)';}
}

function removeFreeEntry(id,el){
  F.items=F.items.filter(x=>x!==id);
  if(el) el.remove();
  const btn=document.getElementById('float-next-btn');
  if(btn){
    btn.disabled=!F.items.length;
    btn.textContent=F.items.length?'שמור ('+F.items.length+' פריטים)':'בחר פריטים';
  }
}

function floatNext(){
  if(F.action==='dispatch'){
    const emptyPelican=pelicanHasEmptySelection();
    if(emptyPelican){
      alert('לא נבחרו רחפנים בתוך '+emptyPelican+'! לחץ על הפליקן ברשימה כדי לבחור מה בפנים לפני שממשיכים.');
      return;
    }
    step=3; renderStep(); return;
  }
  if(F.action==='transfer'){ step=3; renderStep(); return; }
  step=2; renderStep();
}

function setItemCond(id,cond,btn){
  if(!F.itemCond) F.itemCond={};
  F.itemCond[id]=cond;
  const row=btn.closest('.item-cond-row');
  if(row){
    row.querySelectorAll('button').forEach(b=>b.classList.remove('ok-on','fault-on'));
    if(cond==='ok') row.querySelector('.ok-btn').classList.add('ok-on');
    else row.querySelector('.fault-btn').classList.add('fault-on');
  }
}

function stepTransferFromItems(){
  const outItems=ITEMS.filter(i=>db.items[i.id]&&(db.items[i.id].status==='out'||db.items[i.id].status==='fault')&&db.items[i.id].where===F.person).map(i=>({id:i.id,displayId:i.id}));
  const freeItems=Object.keys(db.items||{}).filter(id=>id.indexOf('חופשי:')===0&&db.items[id].where===F.person&&(db.items[id].status==='out'||db.items[id].status==='fault')).map(id=>({id,displayId:db.items[id].displayId||id.replace('חופשי:','')}));
  const allItems=[...outItems,...freeItems];
  if(!allItems.length) return`<div class="sheet-title">העברה</div><div class="empty">אין ציוד ב${F.person}</div><button class="back-btn" onclick="step=1;renderStep()">חזרה</button>`;
  let html=`<div class="sheet-title">מה מועבר מ${F.person}?</div><div style="height:60px"></div>`;
  html+=`<div class="check-grid">`;
  allItems.forEach(item=>{
    const on=F.items.includes(item.id);
    const safeId=escId(item.id);
    html+=`<div class="check-item${on?' on':''}" onclick="toggleItem('${safeId}')">
      <div class="check-box${on?' on':''}" id="cb-${safeId}"></div>
      <div style="flex:1"><div class="check-lbl">${item.displayId}</div></div>
    </div>`;
  });
  html+=`</div><div style="height:70px"></div>`;
  return html;
}

function stepAction(){
  return`<div class="sheet-title">מה עושים?</div>
  <div class="cond-row" style="margin-bottom:8px">
    <button class="cond-btn ${F.action==='dispatch'?'ok-on':''}" id="act-d" onclick="F.action='dispatch';renderStep()">↑ העמסה</button>
    <button class="cond-btn ${F.action==='return'?'ok-on':''}" id="act-r" onclick="F.action='return';renderStep()">↓ החזרה</button>
  </div>
  <div style="margin-bottom:20px">
    <button class="cond-btn" style="width:100%;${F.action==='transfer'?'border-color:var(--accent);background:var(--accent-dim);color:var(--accent)':''}" id="act-t" onclick="F.action='transfer';renderStep()">↔ העברה בין מיקומים</button>
  </div>
  <button class="next-btn" onclick="step=1;renderStep()">המשך</button>`;
}

function stepPerson(){
  const title = F.action==='transfer' ? 'מאיפה?' : 'לאן יורד הציוד?';
  const locs=getLocations();
  const btns=locs.map(p=>`<button class="person-btn${F.person===p?' on':''}" onclick="selPerson('${escId(p)}')">${p}</button>`).join('');
  const multiBtn = F.action==='dispatch' ? `<button class="back-btn" style="margin-top:10px;border-color:var(--accent);color:var(--accent)" onclick="startMultiDest()">🔀 מוציא למספר מקומות במקביל</button>` : '';
  const clearBtn = (db.customLocations&&db.customLocations.length) ? `<button class="back-btn" style="margin-top:6px;font-size:11px;color:var(--text3);border-color:var(--border2)" onclick="clearCustomLocations()">🗑️ נקה יעדים ישנים שהצטברו (${db.customLocations.length})</button>` : '';
  return`<div class="sheet-title">${title}</div>
  <div class="person-grid">${btns}</div>
  <input class="person-other" id="other-inp" placeholder="מיקום חדש..." value="${locs.includes(F.person)?'':F.person}" oninput="F.person=this.value.trim();updateNext1()">
  <button class="next-btn" id="next1" onclick="step=2;renderStep()" ${F.person?'':'disabled'}>המשך</button>
  ${multiBtn}
  ${clearBtn}
  <button class="back-btn" onclick="step=0;renderStep()">חזרה</button>`;
}
function clearCustomLocations(){
  if(!confirm('לנקות את כל היעדים המותאמים שהצטברו? (המקומות הקבועים ברשימה יישארו)')) return;
  db.customLocations=[];
  save();
  renderStep();
}
function startMultiDest(){
  F.multiDest=true;
  F.person='(מספר יעדים)';
  step=2; renderStep();
}

function stepItems(){
  try {
  const allCats=[...new Set(ITEMS.map(i=>i.cat))].filter(c=>!PARTNER_CATS.has(c)&&!NO_DISPATCH_CATS.has(c));
  const cats=[...CAT_ORDER.filter(c=>allCats.includes(c)), ...allCats.filter(c=>!CAT_ORDER.includes(c))];
  let html=`<div class="sheet-title">פריטים → ${F.person}</div>
  <div style="font-size:11px;color:var(--accent);margin-bottom:12px;background:var(--accent-dim);padding:7px 10px;border-radius:8px;font-weight:600">סימון רחפן = שלט יוצא אוטומטית כסט</div>
  <div style="height:60px"></div>`;

  // (הוסר: פריטים מותאמים אישית הוצגו קודם בבלוק נפרד למעלה בלי קשר לקטגוריה — עכשיו הם מוצגים בתוך הקטגוריה שלהם כמו כל פריט אחר)

  cats.forEach(cat=>{
    const inCat=ITEMS.filter(i=>i.cat===cat&&db.items[i.id]&&db.items[i.id].status==='base'&&!db.items[i.id].worn);
    if(!inCat.length) return;

    // ערכה — הצג כפריט אחד עם אפשרות פתיחה
    if(KIT_GROUPS[cat]){
      const kitLabel=KIT_GROUPS[cat];
      const allSelected=inCat.every(i=>F.items.includes(i.id));
      const someSelected=inCat.some(i=>F.items.includes(i.id));
      const isExpanded=expandedKits[cat]!==false;
      const kitId='kit-'+Object.keys(KIT_GROUPS).indexOf(cat);
      kitIdMap[kitId]=cat;
      html+=`<div class="cat-check-hdr" id="${kitId}" style="cursor:pointer" onclick="toggleKitExpand('${kitId}')">
        <span>${kitLabel} ${isExpanded?'▲':'▼'}</span>
        <button onclick="event.stopPropagation();toggleCatById('${kitId}')" style="margin-right:8px">${allSelected?'בטל הכל':'כולם'}</button>
      </div>`;
      if(someSelected&&!isExpanded){
        html+=`<div style="font-size:12px;color:var(--accent);padding:4px 4px 8px;font-weight:600">${inCat.filter(i=>F.items.includes(i.id)).length}/${inCat.length} פריטים סומנו</div>`;
      }
      if(isExpanded){
        html+=`<div class="check-grid">`;
        inCat.forEach(item=>{
          const on=F.items.includes(item.id);
          const label=cleanLabel(item.id);
          html+=`<div class="check-item${on?' on':''}" onclick="toggleItem('${escId(item.id)}')">
            <div class="check-box${on?' on':''}" id="cb-${item.id}"></div>
            <div style="flex:1"><div class="check-lbl" style="font-size:12px">${colorDot(item)}${label}</div></div>
          </div>`;
        });
        html+=`</div>`;
      }
      return;
    }

    html+=`<div class="cat-check-hdr"><span>${cat}</span><button onclick="toggleCat(this.closest('.cat-check-hdr').dataset.cat)">כולם</button></div>`.replace('<div class="cat-check-hdr">', `<div class="cat-check-hdr" data-cat="${cat.replace(/"/g,'&quot;')}">`);
    html+=`<div class="check-grid">`;
    inCat.forEach(item=>{
      const on=F.items.includes(item.id);
      const partner=getPartner(item.id);
      const partnerAvail=partner&&db.items[partner]&&db.items[partner].status==='base';
      let partnerLabel=partner&&partnerAvail?`<div class="check-sub">+שלט</div>`:'';
      if(PELICAN_ITEMS.includes(item.id)&&on){
        const n=(F.pelicanContents&&F.pelicanContents[item.id]&&F.pelicanContents[item.id].ids&&F.pelicanContents[item.id].ids.length)||0;
        partnerLabel=n?`<div class="check-sub">✓ ${n} רחפנים נבחרו — הקש לעריכה</div>`:`<div class="check-sub" style="color:var(--red)">⚠ לא נבחרו רחפנים — הקש כאן</div>`;
      }
      const safeId=escId(item.id);
      html+=`<div class="check-item${on?' on':''}" onclick="toggleItem('${safeId}')">
        <div class="check-box${on?' on':''}" id="cb-${safeId}"></div>
        <div style="flex:1"><div class="check-lbl">${colorDot(item)}${item.id}</div>${partnerLabel}</div>
      </div>`;
    });
    html+=`</div>`;
  });
  html+=`<div style="height:8px"></div>
  <div class="cat-check-hdr"><span>הזנה חופשית</span></div>
  <div style="display:flex;gap:8px;padding:6px 0">
    <input id="free-entry-inp" class="search-box" placeholder="מספר / שם פריט..." style="margin-bottom:0;flex:1">
    <button onclick="addFreeEntry()" style="padding:9px 14px;background:var(--accent);color:#fff;border:none;border-radius:9px;font:700 13px/1 Heebo,sans-serif;cursor:pointer;flex-shrink:0">+ הוסף</button>
  </div>
  <div id="free-entries-list"></div>
  <div style="height:70px"></div>`;
  return html;
  } catch(e) {
    return `<div style="padding:20px;color:red;font-size:13px">שגיאה: ${e.message}</div>`;
  }
}

function stepReturnItems(){
  const outItems=ITEMS.filter(i=>db.items[i.id]&&(db.items[i.id].status==='out'||db.items[i.id].status==='fault'));
  // הסתר שלטים שהם שותפי סט — יחזרו אוטומטית
  const mainItems=outItems.filter(i=>{
    const partner=getPartner(i.id);
    // אם זה שלט שיש לו רחפן בשטח — הסתר אותו
    if(partner&&db.items[partner]&&(db.items[partner].status==='out'||db.items[partner].status==='fault')){
      return !PARTNER_CATS.has(i.cat);
    }
    return true;
  });
  // הוסף פריטים חופשיים
  const freeItems=Object.keys(db.items||{}).filter(id=>id.indexOf('חופשי:')===0&&(db.items[id].status==='out'||db.items[id].status==='fault')).map(id=>({id,cat:'חופשי',displayId:db.items[id].displayId||id.replace('חופשי:','')}));
  const allOut=[...mainItems.map(i=>({id:i.id,cat:i.cat,displayId:i.id})),...freeItems];
  if(!allOut.length) return`<div class="sheet-title">החזרה</div><div class="empty">אין ציוד בשטח</div><button class="back-btn" onclick="step=0;renderStep()">חזרה</button>`;
  const byP={};
  allOut.forEach(item=>{const w=(db.items[item.id]||{}).where||'לא ידוע';if(!byP[w])byP[w]=[];byP[w].push(item);});
  let html=`<div class="sheet-title">מה חוזר?</div><div style="height:60px"></div>`;
  Object.keys(byP).forEach(p=>{
    html+=`<div class="cat-check-hdr"><span>📌 ${p}</span><button onclick="togglePersonReturn('${escId(p)}')">כולם</button></div>`;
    html+=`<div class="check-grid">`;
    byP[p].forEach(item=>{
      const on=F.items.includes(item.id);
      const safeId=escId(item.id);
      html+=`<div class="check-item${on?' on':''}" onclick="toggleItem('${safeId}')">
        <div class="check-box${on?' on':''}" id="cb-${safeId}"></div>
        <div style="flex:1"><div class="check-lbl">${colorDotById(item.id)}${item.displayId}</div><div style="font-size:10px;color:var(--text3)">${item.cat}</div></div>
      </div>`;
    });
    html+=`</div>`;
  });
  html+=`<div style="height:70px"></div>`;
  return html;
}

function toggleItem(id){
  const isSelected=F.items.includes(id);
  if(isSelected){
    if(PELICAN_ITEMS.includes(id)&&(F.action==='dispatch'||F.action==='return')){
      // נגיעה חוזרת בפליקן שכבר נבחר — פתח לעריכה במקום לבטל ולמחוק את הבחירה
      if(F.action==='dispatch') openPelicanContentPicker(id);
      else openPelicanReturnCheck(id);
      return;
    }
    removeFromSelection(id);
  }
  else addToSelection(id);
  [id, getPartner(id)].filter(Boolean).forEach(x=>{
    const cb=document.getElementById('cb-'+x);
    if(cb){
      const on=F.items.includes(x);
      cb.className='check-box'+(on?' on':'');
      const row=cb.closest('.check-item');
      if(row) row.className='check-item'+(on?' on':'');
    }
  });
  const floatBtn=document.getElementById('float-next-btn');
  if(floatBtn){
    floatBtn.disabled=!F.items.length;
    floatBtn.textContent=F.items.length?`המשך (${F.items.length} פריטים)`:'המשך';
  }
}
function toggleCat(cat){
  const inCat=ITEMS.filter(i=>i.cat===cat&&db.items[i.id]&&db.items[i.id].status==='base'&&!db.items[i.id].worn).map(i=>i.id);
  const allOn=inCat.every(id=>F.items.includes(id));
  if(allOn) inCat.forEach(id=>removeFromSelection(id));
  else inCat.forEach(id=>addToSelection(id));
  renderStep();
}
function togglePersonReturn(person){
  const pItems=ITEMS.filter(i=>(db.items[i.id].status==='out'||db.items[i.id].status==='fault')&&db.items[i.id].where===person).map(i=>i.id);
  const allOn=pItems.every(id=>F.items.includes(id));

  else pItems.forEach(id=>{if(!F.items.includes(id))F.items.push(id);});

}

function stepAssignDest(){
  const locs=getLocations();
  const secondarySet=new Set();
  F.items.forEach(id=>{
    const partner=SET_PAIRS[id];
    if(partner&&F.items.includes(partner)) secondarySet.add(partner);
  });
  const mainItems=F.items.filter(id=>!secondarySet.has(id));
  if(!F.itemDest) F.itemDest={};
  if(!F.destSelection) F.destSelection=[];
  const allAssigned=mainItems.every(id=>F.itemDest[id]);

  let html=`<div class="sheet-title">לאן הולך כל פריט?</div>
  <div style="font-size:12px;color:var(--text3);margin-bottom:10px">סמן כמה פריטים ביחד, בחר להם יעד אחד — וחוזרים על זה לכל קבוצה הבאה</div>
  <div class="check-grid" style="margin-bottom:12px">`;
  mainItems.forEach(id=>{
    const item=ITEMS.find(i=>i.id===id);
    const assigned=F.itemDest[id];
    const checked=F.destSelection.includes(id);
    const safeId=escId(id);
    html+=`<div class="check-item${checked?' on':''}" onclick="toggleDestSel('${safeId}')" style="${assigned&&!checked?'opacity:0.6':''}">
      <div class="check-box${checked?' on':''}"></div>
      <div style="flex:1">
        <div class="check-lbl">${item?colorDot(item):''}${id}</div>
        ${assigned?`<div style="font-size:10px;color:var(--accent);font-weight:700">→ ${assigned}</div>`:''}
      </div>
    </div>`;
  });
  html+=`</div>`;

  if(F.destSelection.length){
    html+=`<div style="font-size:13px;color:var(--text1);font-weight:600;margin-bottom:8px">${F.destSelection.length} פריטים מסומנים — לאן?</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">
      ${locs.map(l=>`<button type="button" onclick="bulkAssignDest('${escId(l)}')" style="padding:8px 12px;border-radius:16px;border:1px solid var(--accent);background:transparent;color:var(--accent);font-size:13px;font-weight:600;cursor:pointer">${l}</button>`).join('')}
    </div>
    <div style="display:flex;gap:6px;margin-bottom:12px">
      <input placeholder="או הקלד יעד חדש..." id="bulk-dest-inp" style="flex:1;padding:8px;border:1px solid var(--border2);border-radius:6px;font-size:13px;box-sizing:border-box" oninput="F.bulkDestVal=this.value.trim()" onkeydown="if(event.key==='Enter'){event.preventDefault();bulkAssignDest((F.bulkDestVal||this.value.trim()));}">
      <button type="button" onclick="bulkAssignDest(F.bulkDestVal||document.getElementById('bulk-dest-inp').value.trim())" style="padding:8px 16px;background:var(--accent);color:#fff;border:none;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer">✓ הוסף</button>
    </div>`;
  }

  html+=`<button class="next-btn" onclick="confirmAssignDest()" ${allAssigned?'':'disabled'}>${allAssigned?'המשך':'סמן יעד לכל הפריטים כדי להמשיך'}</button>
  <button class="back-btn" onclick="step=2;renderStep()">→ חזרה לפריטים</button>`;
  return html;
}
function toggleDestSel(id){
  if(!F.destSelection) F.destSelection=[];
  const i=F.destSelection.indexOf(id);
  if(i>=0) F.destSelection.splice(i,1); else F.destSelection.push(id);
  renderStep();
}
function bulkAssignDest(dest){
  if(!dest) return;
  if(!F.itemDest) F.itemDest={};
  (F.destSelection||[]).forEach(id=>{ F.itemDest[id]=dest; });
  F.destSelection=[];
  F.bulkDestVal='';
  renderStep();
}
function confirmAssignDest(){
  const secondarySet=new Set();
  F.items.forEach(id=>{
    const partner=SET_PAIRS[id];
    if(partner&&F.items.includes(partner)) secondarySet.add(partner);
  });
  const mainItems=F.items.filter(id=>!secondarySet.has(id));
  const missing=mainItems.filter(id=>!F.itemDest||!F.itemDest[id]);
  if(missing.length){
    alert('חסר יעד עבור: '+missing.join(', '));
    return;
  }
  F.items.forEach(id=>{
    const partner=SET_PAIRS[id];
    if(partner&&F.items.includes(partner)){
      F.itemDest[partner]=F.itemDest[id];
    }
  });
  step=4; renderStep();
}
function stepReview(){
  const t=now();
  const previewMsg=buildWhatsappMsg(t,'','');
  const msgHtml=previewMsg.replace(/\*([^*]+)\*/g,'<b>$1</b>');
  const backStep=F.action==='dispatch'?(F.multiDest?3:2):F.action==='transfer'?3:1;
  return`<div class="sheet-title">בדוק לפני שליחה</div>
  <div style="background:var(--bg);border:1px solid var(--border2);border-radius:10px;padding:12px;font-size:13px;line-height:1.8;white-space:pre-wrap;margin-bottom:14px;direction:rtl">${msgHtml}</div>
  <textarea class="notes" id="notes-txt" placeholder="הערות (סוללות, ציוד נלווה...)"></textarea>
  <button class="next-btn" style="margin-top:10px" onclick="doSubmit(this)">✓ אשר ושלח</button>
  <button class="back-btn" onclick="step=${backStep};renderStep()">→ חזור לעריכה</button>`;
}
function doSubmit(btn){
  const t=now();
  const notes=(document.getElementById('notes-txt')||{}).value||'';
  if(!db.log||!Array.isArray(db.log)) db.log=[];
  if(!db.items) db.items={};
  // שמור מיקום חדש בהיסטוריה
  if(F.multiDest){
    const dests=new Set(Object.values(F.itemDest||{}).filter(Boolean));
    dests.forEach(d=>{
      if(!PEOPLE.includes(d)){
        if(!db.customLocations) db.customLocations=[];
        if(!db.customLocations.includes(d)){
          db.customLocations.push(d);
          if(db.customLocations.length>20) db.customLocations.shift();
        }
      }
    });
  } else if(F.person && !PEOPLE.includes(F.person)){
    if(!db.customLocations) db.customLocations=[];
    if(!db.customLocations.includes(F.person)){
      db.customLocations.push(F.person);
      if(db.customLocations.length>20) db.customLocations.shift();
    }
  }

  if(F.action==='transfer'){
    // העברה — שנה מיקום בלי לסמן חזרה
    F.items.forEach(id=>{
      const cond=F.itemCond&&F.itemCond[id]||'ok';
      db.items[id]={...db.items[id], status:cond==='fault'?'fault':'out', where:F.transferDest, ts:t, notes};
      db.log.unshift({id,action:'transfer',person:F.transferDest,from:F.person,cond,notes,ts:t});
    });
  } else {
    // אסוף את כל הפריטים כולל שותפי סט שלא סומנו
    const allReturnIds=[...F.items];
    if(F.action==='return'){
      F.items.forEach(id=>{
        const partner=getPartner(id);
        if(partner&&db.items[partner]&&(db.items[partner].status==='out'||db.items[partner].status==='fault')&&!allReturnIds.includes(partner)){
          allReturnIds.push(partner);
        }
      });
    }
    allReturnIds.forEach(id=>{
      let cond=F.itemCond&&F.itemCond[id]||F.cond||'ok';
      const isFree=id.indexOf('חופשי:')===0;
      const displayId=isFree?id.replace('חופשי:',''):id;
      const isPelican=PELICAN_ITEMS.includes(id);
      let pelicanNote='',faultDesc='';
      if(isPelican&&F.action==='dispatch'){
        const c=(F.pelicanContents&&F.pelicanContents[id])||(db.items[id]&&db.items[id].contents);
        if(c&&c.ids&&c.ids.length) pelicanNote=`תכולה (${c.ids.length}): ${c.ids.join(', ')}`;
      }
      if(isPelican&&F.action==='return'){
        const issues=F.pelicanReturnIssues&&F.pelicanReturnIssues[id];
        if(issues&&Object.keys(issues).length){
          cond='fault';
          faultDesc=Object.entries(issues).map(([did,r])=>`${did}: ${r}`).join(' | ');
          pelicanNote='⚠ בעיה בהחזרה: '+faultDesc;
        }
      }
      const qtyNote=(id==='פקפק'&&F.itemQty&&F.itemQty['פקפק'])?`כמות: ${F.itemQty['פקפק']}`:'';
      const itemNotes=[pelicanNote,qtyNote,notes].filter(Boolean).join(' | ');
      if(F.action==='dispatch'){
        const dest=(F.multiDest&&F.itemDest&&F.itemDest[id])?F.itemDest[id]:F.person;
        const contents=isPelican?(((F.pelicanContents&&F.pelicanContents[id])||(db.items[id]&&db.items[id].contents))||null):null;
        db.items[id]={status:cond==='fault'?'fault':'out',where:dest,ts:t,notes:itemNotes,faultDesc:'',free:isFree,displayId,contents};
        db.log.unshift({id,action:'out',person:dest,cond,notes:itemNotes,ts:t,displayId});
        // הרחפנים שנארזו בפליקן — עדכן גם את הסטטוס שלהם עצמם
        if(isPelican&&contents&&contents.ids){
          contents.ids.forEach(droneId=>{
            db.items[droneId]={status:'out',where:dest,ts:t,notes:'ארוז ב'+id,faultDesc:'',free:false,displayId:droneId};
            db.log.unshift({id:droneId,action:'out',person:dest,cond:'ok',notes:'ארוז ב'+id,ts:t,displayId:droneId});
          });
        }
      } else {
        db.items[id]={status:cond==='fault'?'fault':'base',where:'',ts:t,notes:itemNotes,faultDesc,free:isFree,displayId};
        db.log.unshift({id,action:'in',person:'',cond,notes:itemNotes,ts:t,displayId});
        // הרחפנים שהיו בפליקן — החזר כל אחד בהתאם למה שאושר/סומן כבעיה
        if(isPelican){
          const prevContents=db.items[id]&&db.items[id].contents;
          const droneIds=(prevContents&&prevContents.ids)||[];
          const okList=(F.pelicanReturnOk&&F.pelicanReturnOk[id])||droneIds;
          const issues=(F.pelicanReturnIssues&&F.pelicanReturnIssues[id])||{};
          droneIds.forEach(droneId=>{
            if(issues[droneId]){
              db.items[droneId]={status:'fault',where:'',ts:t,notes:'',faultDesc:issues[droneId],free:false,displayId:droneId};
              db.log.unshift({id:droneId,action:'in',person:'',cond:'fault',notes:issues[droneId],ts:t,displayId:droneId});
            } else if(okList.includes(droneId)){
              db.items[droneId]={status:'base',where:'',ts:t,notes:'',faultDesc:'',free:false,displayId:droneId};
              db.log.unshift({id:droneId,action:'in',person:'',cond:'ok',notes:'',ts:t,displayId:droneId});
            }
          });
        }
      }
    });
  }
  db.log=db.log.slice(0,300);
  save();
  renderAll();
  showShareSheet(t,'',notes);
}

function buildWhatsappMsg(t, faultDesc, notes){
  var RLM = '\u200F';
  var action = F.action==='dispatch'
    ? RLM+'\u25B2 \u05D4\u05E2\u05DE\u05E1\u05D4 \u05DC\u05E9\u05D8\u05D7'
    : F.action==='transfer'
    ? RLM+'\u21D4 \u05D4\u05E2\u05D1\u05E8\u05D4'
    : RLM+'\u25BC \u05D4\u05D7\u05D6\u05E8\u05D4 \u05DC\u05DE\u05DB\u05D5\u05DC\u05D4';
  if(F.action==='dispatch' && F.multiDest){
    var byDest = {}, destOrder = [];
    var shownPartners2 = {};
    F.items.forEach(function(id){
      if(shownPartners2[id]) return;
      var item = ITEMS.find(function(i){ return i.id===id; });
      var dest = (F.itemDest && F.itemDest[id]) || '\u05DC\u05DC\u05D0 \u05D9\u05E2\u05D3';
      if(!byDest[dest]){ byDest[dest]=[]; destOrder.push(dest); }
      if(!item && id.indexOf('\u05D7\u05D5\u05E4\u05E9\u05D9:')===0){
        byDest[dest].push(RLM+'\u2022 '+id.replace('\u05D7\u05D5\u05E4\u05E9\u05D9:',''));
        return;
      }
      if(!item) return;
      var partner = getPartner(id);
      var isMain = id.indexOf('\u05E9\u05DC\u05D8-')!==0;
      var partnerSel = partner && F.items.indexOf(partner)>=0;
      if(isMain && partnerSel){
        shownPartners2[partner]=true;
        byDest[dest].push(RLM+'\u2022 '+cleanLabel(id)+' + \u05E9\u05DC\u05D8');
      } else {
        byDest[dest].push(RLM+'\u2022 '+cleanLabel(id));
      }
    });
    var mparts = [action+' | '+t, RLM+'\u25CF \u05DE\u05E1\u05E4\u05E8 \u05D9\u05E2\u05D3\u05D9\u05DD', ''];
    destOrder.forEach(function(dest){
      if(byDest[dest].length){
        mparts.push(RLM+'\u25B8 '+dest+':');
        mparts.push(byDest[dest].join('\n'));
        mparts.push('');
      }
    });
    var mcondLine = F.cond==='fault' ? '! \u05EA\u05E7\u05DC\u05D4' : '\u2713 \u05EA\u05E7\u05D9\u05DF';
    mparts.push(RLM+mcondLine);
    if(notes) mparts.push(RLM+'* '+notes);
    return mparts.join('\n').replace(/\n{3,}/g,'\n\n').trim();
  }
  var loc = F.action==='dispatch' ? RLM+'\u25CF '+F.person : F.action==='transfer' ? RLM+'\u25CF '+F.person+' \u2192 '+(F.transferDest||'') : '';
  var shownPartners = {};
  var byCat = {}, catOrder = [];
  F.items.forEach(function(id){
    if(shownPartners[id]) return;
    var item = ITEMS.find(function(i){ return i.id===id; });
    // פריט חופשי
    if(!item && id.indexOf('חופשי:')===0){
      var freeLabel = id.replace('חופשי:','');
      var cat = 'חופשי';
      if(!byCat[cat]){ byCat[cat]=[]; catOrder.push(cat); }
      byCat[cat].push(RLM+'• '+freeLabel);
      return;
    }
    if(!item) return;
    var cat = item.cat;
    if(!byCat[cat]){ byCat[cat]=[]; catOrder.push(cat); }
    var partner = getPartner(id);
    var isMain = id.indexOf('\u05E9\u05DC\u05D8-')!==0;
    var partnerSel = partner && F.items.indexOf(partner)>=0;
    if(isMain && partnerSel){
      shownPartners[partner]=true;
      byCat[cat].push(RLM+'\u2022 '+cleanLabel(id)+' + \u05E9\u05DC\u05D8');
    } else {
      var qty = (id==='\u05E4\u05E7\u05E4\u05E7'&&F.itemQty&&F.itemQty['\u05E4\u05E7\u05E4\u05E7']) ? ' x'+F.itemQty['\u05E4\u05E7\u05E4\u05E7'] : '';
      byCat[cat].push(RLM+'\u2022 '+cleanLabel(id)+qty);
    }
  });
  var parts = [action+' | '+t, loc, ''];
  catOrder.forEach(function(cat){
    if(byCat[cat].length){
      parts.push(RLM+cat+':');
      parts.push(byCat[cat].join('\n'));
      parts.push('');
    }
  });
  var condLine = F.cond==='fault' ? '! \u05EA\u05E7\u05DC\u05D4' : '\u2713 \u05EA\u05E7\u05D9\u05DF';
  parts.push(RLM+condLine);
  if(notes) parts.push(RLM+'* '+notes);
  return parts.join('\n').replace(/\n{3,}/g,'\n\n').trim();
}
function showFaultReport(){
  const RLM='\u200F';
  const byCat={}, catOrder=[];
  ITEMS.forEach(item=>{
    const s=db.items[item.id];
    if(!s) return;
    const isFault = s.status==='fault' || s.worn===true;
    if(!isFault) return;
    const reason = s.worn===true ? (s.wornReason||'') : (s.faultDesc||'');
    if(!byCat[item.cat]){ byCat[item.cat]=[]; catOrder.push(item.cat); }
    const loc = s.where ? ` (${s.where})` : '';
    byCat[item.cat].push(RLM+'• '+item.id+loc+(reason?' — '+reason:''));
  });
  const total = catOrder.reduce((n,c)=>n+byCat[c].length,0);
  const el=document.getElementById('sheet-content');
  if(total===0){
    el.innerHTML=`
      <div class="sheet-title">🛠️ דו"ח תקלות</div>
      <div style="text-align:center;color:var(--text3);padding:30px 0">אין תקלות פתוחות כרגע ✓</div>
      <button class="back-btn" onclick="closeSheet()">סגור</button>
    `;
    document.getElementById('sheet-bg').classList.add('on');
    return;
  }
  const dateStr = new Date().toLocaleDateString('he-IL');
  const parts=[RLM+'🛠️ דו"ח תקלות | '+dateStr, RLM+'סה"כ: '+total, ''];
  catOrder.forEach(cat=>{
    parts.push(RLM+'▸ '+cat+':');
    parts.push(byCat[cat].join('\n'));
    parts.push('');
  });
  const msg = parts.join('\n').replace(/\n{3,}/g,'\n\n').trim();
  const encoded = encodeURIComponent(msg);
  const msgHtml = msg.replace(/\n/g,'<br>');
  el.innerHTML = `
    <div class="sheet-title">🛠️ דו"ח תקלות (${total})</div>
    <div style="background:var(--bg);border:1px solid var(--border2);border-radius:10px;padding:12px;font-size:13px;line-height:1.8;white-space:pre-wrap;margin-bottom:16px;direction:rtl;max-height:50vh;overflow-y:auto">${msgHtml}</div>

      📲 שלח לוואטסאפ
    </a>
    <button class="back-btn" onclick="closeSheet()">סגור</button>
  `;
  document.getElementById('sheet-bg').classList.add('on');
}
function showShareSheet(t, faultDesc, notes){
  const msg = buildWhatsappMsg(t, faultDesc, notes);
  const el = document.getElementById('sheet-content');
  const encoded = encodeURIComponent(msg);
  const msgHtml = msg.replace(/\*([^*]+)\*/g,'<b>$1</b>');

function renderAll(){renderInventory();renderOut();renderLog();renderHeader();renderDay();}
function renderHeader(){
  let o=0,f=0;
  ITEMS.forEach(i=>{
    const s=db.items[i.id];
    if(!s) return;
    if(s.status==='out') o++;
    if(s.status==='fault'||s.worn===true) f++;
  });
  let freeOut=0,freeFault=0;
  Object.keys(db.items||{}).forEach(id=>{
    if(id.indexOf('חופשי:')!==0) return;
    const s=db.items[id];
    if(s.status==='out') freeOut++;
    if(s.status==='fault') freeFault++;
  });
  document.getElementById('hdr-out').textContent='בשטח: '+(o+freeOut);
  document.getElementById('hdr-fault').textContent='תקלות: '+(f+freeFault);
  document.getElementById('sn-base').textContent=ITEMS.length-o-f;
  document.getElementById('sn-out').textContent=o;
  document.getElementById('sn-fault').textContent=f;
}
function renderInventory(){
  const q=(document.getElementById('search-box')?.value||'').toLowerCase();
  const el=document.getElementById('inventory-list');el.innerHTML='';
  const allCats=[...new Set(ITEMS.map(i=>i.cat))];
  const cats=[...CAT_ORDER.filter(c=>allCats.includes(c)), ...allCats.filter(c=>!CAT_ORDER.includes(c))];
  cats.forEach(cat=>{
    const items=ITEMS.filter(i=>i.cat===cat&&(!q||i.id.toLowerCase().includes(q)));
    if(!items.length)return;
    const sec=document.createElement('div');
    sec.innerHTML=`<div class="cat-hdr"><span>${cat}</span><span style="color:var(--text3)">${items.length}</span></div>`;
    items.forEach(item=>{
      const s=db.items[item.id];
      const isWorn = s.worn===true;
      const sl=isWorn?'בלאי':s.status==='base'?'בבסיס':s.status==='out'?'בשטח':'תקלה';
      const bc=isWorn?'b-fault':s.status==='base'?'b-base':s.status==='out'?'b-out':'b-fault';
      const row=document.createElement('div');
      row.className=`item-row ${isWorn?'fault':s.status}`;
      const contentsStr=(PELICAN_ITEMS.includes(item.id)&&s.contents&&s.contents.ids&&s.contents.ids.length)?` <span style="font-size:10px;color:var(--text3);font-weight:500">(${s.contents.ids.length} רחפנים בפנים)</span>`:'';
      row.innerHTML=`<div class="item-id">${colorDot(item)}${item.id}${v2Tag(item)}${contentsStr}</div><div class="item-where">${notInUseTag(item)}${s.where||''}</div><div class="item-badge ${bc}">${sl}</div>`;
      row.onclick=()=>{
        if(isWorn||s.status==='base'){
          // הצג תפריט קצר
          openItemMenu(item.id);
        } else {
          startFlow(item.id,'return');
        }
      };
      sec.appendChild(row);
    });
    el.appendChild(sec);
  });
  if(!el.children.length)el.innerHTML='<div class="empty">לא נמצא</div>';
}
function renderOut(){
  const el=document.getElementById('out-list');
  const byP={};
  ITEMS.forEach(item=>{
    const s=db.items[item.id];
    if(s&&(s.status==='out'||s.status==='fault')){
      const p=s.where||'לא ידוע';
      if(!byP[p])byP[p]=[];
      byP[p].push({id:item.id,label:item.id,s});
    }
  });
  // פריטים חופשיים
  Object.keys(db.items||{}).forEach(id=>{
    if(id.indexOf('חופשי:')===0){
      const s=db.items[id];
      if(s&&(s.status==='out'||s.status==='fault')){
        const p=s.where||'לא ידוע';
        if(!byP[p])byP[p]=[];
        byP[p].push({id,label:s.displayId||id.replace('חופשי:',''),s});
      }
    }
  });
  el.innerHTML='';
  const people=Object.keys(byP);
  if(!people.length){el.innerHTML='<div class="empty">כל הציוד בבסיס ✓</div>';return;}
  people.forEach(p=>{
    const sec=document.createElement('div');
    sec.innerHTML=`<div class="cat-hdr"><span>📌 ${p}</span><span style="color:var(--yellow)">${byP[p].length} פריטים</span></div>`;
    byP[p].forEach(({id,label,s})=>{
      const bc=s.status==='fault'?'b-fault':'b-out';
      const sl=s.status==='fault'?'תקלה':'בשטח';
      const row=document.createElement('div');
      row.className=`item-row ${s.status}`;
      row.style.flexWrap='wrap';
      row.style.gap='6px';
      row.innerHTML=`
        <div class="item-id" style="flex:1">${colorDotById(id)}${label}</div>
        <div class="item-badge ${bc}">${sl}</div>
        <div style="width:100%;display:flex;gap:6px;margin-top:4px">
          <button onclick="quickTransfer('${escId(id)}')" style="flex:1;padding:7px;background:var(--accent-dim);color:var(--accent);border:1px solid var(--accent);border-radius:8px;font:600 12px/1 Heebo,sans-serif;cursor:pointer">↔ העבר</button>
          <button onclick="quickReturn('${escId(id)}')" style="flex:1;padding:7px;background:var(--green-dim);color:var(--green);border:1px solid var(--green);border-radius:8px;font:600 12px/1 Heebo,sans-serif;cursor:pointer">✓ חזר למכולה</button>
        </div>`;
      sec.appendChild(row);
    });
    el.appendChild(sec);
  });
}
function getSetIds(id){
  // מחזיר את כל הפריטים בסט (רחפן + שלט)
  const ids=[id];
  const partner=getPartner(id);
  if(partner&&db.items[partner]&&(db.items[partner].status==='out'||db.items[partner].status==='fault')){
    ids.push(partner);
  }
  return ids;
}

function quickReturn(id){
  const t=now();
  const ids=getSetIds(id);
  if(!db.log||!Array.isArray(db.log)) db.log=[];
  ids.forEach(function(itemId){
    db.items[itemId]={status:'base',where:'',ts:t,notes:'',faultDesc:''};
    db.log.unshift({id:itemId,action:'in',person:'',cond:'ok',notes:'',ts:t});
  });
  db.log=db.log.slice(0,300);
  save();renderAll();
}

function quickTransfer(id){
  // פתח sheet מהיר לבחירת יעד בלבד
  const el=document.getElementById('sheet-content');
  const ids=getSetIds(id);
  const btns=PEOPLE.map(p=>`<button class="person-btn" onclick="doQuickTransfer(${escJson(ids)},'${p}')">${p}</button>`).join('');
  el.innerHTML=`
    <div class="sheet-title">העבר ${id} לאן?</div>
    ${ids.length>1?`<div style="font-size:12px;color:var(--accent);background:var(--accent-dim);padding:7px 10px;border-radius:8px;margin-bottom:12px">יועבר כסט עם ${ids[1]}</div>`:''}
    <div class="person-grid">${btns}</div>
    <input class="person-other" id="qt-other" placeholder="מיקום אחר..." oninput="document.getElementById('qt-confirm').disabled=!this.value.trim()">
    <button class="next-btn" id="qt-confirm" disabled onclick="doQuickTransfer(${escJson(ids)},document.getElementById('qt-other').value.trim())" style="margin-top:8px">אשר</button>
    <button class="back-btn" onclick="closeSheet()">ביטול</button>
  `;
  document.getElementById('sheet-bg').classList.add('on');
}

function doQuickTransfer(ids,dest){
  if(!dest) return;
  const t=now();
  if(!db.log||!Array.isArray(db.log)) db.log=[];
  ids.forEach(function(itemId){
    const from=db.items[itemId]?db.items[itemId].where:'';
    db.items[itemId]={status:'out',where:dest,ts:t,notes:'',faultDesc:''};
    db.log.unshift({id:itemId,action:'transfer',person:dest,from:from,cond:'ok',notes:'',ts:t});
  });
  db.log=db.log.slice(0,300);
  save();renderAll();closeSheet();
}

function renderLog(){
  const el=document.getElementById('log-list');
  const log=db.log&&Array.isArray(db.log)?db.log:[];
  if(!log.length){el.innerHTML='<div class="empty">אין רישומים עדיין</div>';return;}
  el.innerHTML='';
  log.slice(0,80).forEach(e=>{
    const ac=e.action==='out'?'lb-out':e.action==='transfer'?'lb-out':'lb-in';
    const al=e.action==='out'?'ירד':e.action==='transfer'?'עבר ל-'+(e.person||''):'חזר';
    const fb=e.cond==='fault'?`<span class="log-badge lb-fault">תקלה</span>`:'';
    const row=document.createElement('div');
    row.className='log-row';
    row.innerHTML=`<div class="log-top"><div class="log-id"><span class="log-badge ${ac}">${al}</span>${fb} ${e.id}</div><div class="log-ts">${e.ts}</div></div>
    <div class="log-sub">${e.action!=='transfer'&&e.person?'📍 '+e.person:''}${e.faultDesc?'<br>⚠ '+e.faultDesc:''}${e.notes?'<br>📝 '+e.notes:''}</div>`;
    el.appendChild(row);
  });
}
function showPage(name,btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));

  document.getElementById('page-'+name).classList.add('on');

  if(name==='day') renderDay();

}

  var val=document.getElementById('pass-inp').value;

    localStorage.setItem('uav_auth',APP_PASS);

function renderTotal(){
  const el=document.getElementById('total-content');

  let html='';
  TOTAL_INVENTORY.forEach(function(section){
    const total=section.items.reduce(function(s,i){return s+i.qty;},0);
    html+=`<div class="day-section">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div class="day-section-title" style="margin-bottom:0">${section.cat}</div>
        <div style="font-size:13px;font-weight:800;color:var(--accent)">${total} סה"כ</div>
      </div>`;

      html+=`<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border2);font-size:13px">

}

function renderManage(){
  const el=document.getElementById('manage-content');
  let html=`<div style="padding:12px">
    <h3 style="margin-bottom:16px">הוספת פריט חדש</h3>
    <input id="item-name" placeholder="שם הפריט" style="width:100%;padding:8px;margin-bottom:10px;border:1px solid var(--border2);border-radius:6px">
    <input id="item-qty" type="number" placeholder="כמות" style="width:100%;padding:8px;margin-bottom:10px;border:1px solid var(--border2);border-radius:6px">
    <select id="item-cat" style="width:100%;padding:8px;margin-bottom:10px;border:1px solid var(--border2);border-radius:6px">
      <option value="">-- בחר קטגוריה --</option>`;
  
  const cats=[...new Set(ITEMS.map(i=>i.cat))].sort();
  cats.forEach(c=>html+=`<option value="${c}">${c}</option>`);
  html+=`<option value="__new__">+ קטגוריה חדשה</option></select>
    <input id="item-new-cat" placeholder="שם קטגוריה חדשה" style="width:100%;padding:8px;margin-bottom:10px;border:1px solid var(--border2);border-radius:6px;display:none">
    <label style="display:flex;align-items:center;gap:6px;margin-bottom:12px;font-size:13px;color:var(--text2)">
      <input type="checkbox" id="item-has-controller" style="width:16px;height:16px">
      כולל שלט - הוסף אוטומטית לקטגוריית השלטים וצמד אליו
    </label>
    <button onclick="addNewItem()" style="width:100%;padding:10px;background:var(--accent);color:white;border:none;border-radius:6px;font-weight:600;cursor:pointer">הוסף פריט</button>
    <hr style="margin:20px 0;border:none;border-top:1px solid var(--border2)">
    <h3 style="margin-bottom:12px">פריטים שהוספתי</h3>
    <div id="custom-items-list" style="max-height:400px;overflow-y:auto"></div>
  </div>`;
  el.innerHTML=html;
  
  document.getElementById('item-cat').addEventListener('change',e=>{
    const newCatInput=document.getElementById('item-new-cat');
    newCatInput.style.display=e.target.value==='__new__'?'block':'none';
    // זוכר את דפוס השם האחרון שהוזן לקטגוריה הזו — כדי שיהיה צריך להוסיף רק את המספר
    const pattern=(db.categoryNamePatterns||{})[e.target.value];
    const nameInput=document.getElementById('item-name');
    if(pattern){
      nameInput.value=pattern;
      const m=pattern.match(/\d+$/);
      nameInput.focus();
      if(m){
        const start=pattern.length-m[0].length;
        nameInput.setSelectionRange(start,pattern.length);
      } else {
        nameInput.setSelectionRange(0,pattern.length);
      }
    }
  });
  
  renderCustomItemsList();
}

  const list=document.getElementById('custom-items-list');

  if(!custom.length){
    list.innerHTML='<p style="color:var(--text3);font-size:12px">אין פריטים מותאמים עדיין</p>';

function addNewItem(){
  const name=document.getElementById('item-name').value.trim();
  const qty=parseInt(document.getElementById('item-qty').value)||1;
  let cat=document.getElementById('item-cat').value;
  const hasController=document.getElementById('item-has-controller').checked;
  
  if(!name){alert('הזן שם פריט');return;}
  if(!cat){alert('בחר קטגוריה');return;}
  
  if(cat==='__new__'){
    cat=document.getElementById('item-new-cat').value.trim();
    if(!cat){alert('הזן שם קטגוריה');return;}
  }
  
  if(!db.customItems) db.customItems=[];
  const ids=addCustomItemToInventory(name,qty,cat);
  db.customItems.push({name,qty,cat,ids});

  // זוכר את דפוס השם לפעם הבאה שמוסיפים לקטגוריה הזו
  if(!db.categoryNamePatterns) db.categoryNamePatterns={};
  db.categoryNamePatterns[cat]=name;

  // אם כולל שלט — יוצר אוטומטית פריט שלט מצומד בקטגוריית השלטים
  if(hasController){
    const ctrlCat=cat.indexOf('רחפני ')===0 ? 'שלטי '+cat.slice(6) : 'שלטי '+cat;
    const ctrlIds=[];
    ids.forEach(id=>{
      const ctrlId='שלט-'+id;
      ITEMS.push({id:ctrlId,cat:ctrlCat,custom:true});
      if(!db.items[ctrlId]) db.items[ctrlId]={status:'base',where:'',ts:'',notes:'',faultDesc:''};
      SET_PAIRS[id]=ctrlId;
      SET_PAIRS_REV[ctrlId]=id;
      ctrlIds.push(ctrlId);
    });
    db.customItems.push({name:'שלט-'+name,qty,cat:ctrlCat,ids:ctrlIds});
  }
  
  document.getElementById('item-name').value='';
  document.getElementById('item-qty').value='';
  document.getElementById('item-cat').value='';
  document.getElementById('item-new-cat').value='';
  document.getElementById('item-new-cat').style.display='none';
  document.getElementById('item-has-controller').checked=false;
  
  renderManage();
  renderAll();
  save();
}

function removeCustomItem(idx){
  if(!confirm('בטוח? הפריט יוסר גם ממערכת המעקב')) return;
  const item=db.customItems[idx];
  if(item&&item.ids){
    item.ids.forEach(id=>{
      const pos=ITEMS.findIndex(it=>it.id===id);
      if(pos>=0) ITEMS.splice(pos,1);
      if(db.items&&db.items[id]) delete db.items[id];
      // ניקוי צימוד שלט אם היה
      if(SET_PAIRS[id]){ delete SET_PAIRS_REV[SET_PAIRS[id]]; delete SET_PAIRS[id]; }
      if(SET_PAIRS_REV[id]){ delete SET_PAIRS[SET_PAIRS_REV[id]]; delete SET_PAIRS_REV[id]; }
    });
  }
  db.customItems.splice(idx,1);
  renderManage();
  renderAll();
  save();
}

const DAY_CATS = [
  {key:'mission', label:'רחפני משימה'},
  {key:'atati',   label:'רחפני אטטי'},
  {key:'alpha',   label:'רחפני אלפא'},
  {key:'evomax',  label:'מתקני EVOMAX'},
  {key:'kb',      label:'מתקני כדור ברזל'},
  {key:'fpv',     label:'ציוד FPV'},
  {key:'other',   label:'ציוד נוסף'},
];

// מיפוי קטגוריה → מה לספור מהמלאי
const CAT_TO_ITEM_CAT = {
  'mission': 'רחפני משימה',
  'atati':   'רחפני אטטי',
  'alpha':   'רחפני אלפא',
  'evomax':  'מתקני הטלה EVOMAX',
  'fpv':     'FLYCART3',
};

function countOutByCat(itemCat){
  return ITEMS.filter(i=>i.cat===itemCat&&db.items[i.id]&&db.items[i.id].status==='out').length;
}

function renderDay(){
  const el=document.getElementById('day-content');
  if(!el) return;
  const day=db.day||{};
  const isAdmin=localStorage.getItem('uav_admin')==='1';

  let html='<div style="padding:12px">';

  // כפתור עריכה
  html+=`<button onclick="openDayEdit()" style="width:100%;padding:11px;background:none;border:1.5px dashed var(--border);border-radius:10px;font:600 13px/1 Heebo,sans-serif;color:var(--text2);cursor:pointer;margin-bottom:12px">
    ✏️ ${day.date?'עדכן יום':'הגדר יום חדש'}
  </button>`;

  if(!day.date){
    html+='<div class="empty">אין נתוני יום — לחץ "הגדר יום חדש"</div>';
    html+='</div>';
    el.innerHTML=html;
    return;
  }

  // כותרת
  html+=`<div class="day-section">
    <div style="font-size:16px;font-weight:800;margin-bottom:4px">${day.date||''}</div>
    ${day.arrivalTime?`<div style="font-size:13px;color:var(--text2)">הגעה: ${day.arrivalTime}</div>`:''}
  </div>`;

  // הערות מיוחדות
  if(day.notes){
    html+=`<div class="day-section" style="border-right:3px solid var(--yellow);background:var(--yellow-dim)">
      <div style="font-size:14px;font-weight:700">⚡ ${day.notes}</div>
    </div>`;
  }

  // עמדות
  if(day.stations&&day.stations.length){
    html+=`<div class="day-section"><div class="day-section-title">עמדות פעילות</div>`;
    html+=day.stations.map(s=>`<span class="station-badge">${s}</span>`).join('');
    html+='</div>';
  }

  // כמויות מכולה אדומה
  const hasQty=DAY_CATS.some(c=>day.quantities&&day.quantities[c.key]);
  if(hasQty){
    html+=`<div class="day-section"><div class="day-section-title">מכולה אדומה — מצב</div>`;
    DAY_CATS.forEach(function(c){
      const needed=parseInt((day.quantities||{})[c.key])||0;
      if(!needed) return;
      const itemCat=CAT_TO_ITEM_CAT[c.key];
      const dispatched=itemCat?countOutByCat(itemCat):0;
      const pct=dispatched/needed;
      const cls=dispatched>=needed?'qty-ok':dispatched>0?'qty-warn':'qty-over';
      html+=`<div class="qty-row">
        <div class="qty-label">${c.label}</div>
        <div class="qty-progress ${cls}">${dispatched}/${needed}</div>
      </div>`;
    });
    html+='</div>';
  }

  // משימות
  if(day.tasks&&day.tasks.length){
    const done=day.tasks.filter(t=>t.done).length;
    html+=`<div class="day-section">
      <div class="day-section-title">משימות בוקר — ${done}/${day.tasks.length} בוצעו</div>`;
    day.tasks.forEach(function(task,i){
      html+=`<div class="task-item" onclick="toggleTask(${i})">
        <div class="task-check${task.done?' done':''}"></div>
        <div class="task-text${task.done?' done':''}">${task.text}</div>
      </div>`;
    });
    html+='</div>';
  }

  // כיתות
  if(day.classes){
    html+=`<div class="day-section"><div class="day-section-title">כיתות</div>
      <div style="font-size:13px;line-height:1.8;color:var(--text)">${day.classes.split('\n').filter(l=>l.trim()).map(l=>'• '+l).join('<br>')}</div>
    </div>`;
  }

  // כוח אדם
  if(day.staff){
    html+=`<div class="day-section"><div class="day-section-title">כוח אדם</div>
      <div style="font-size:13px;line-height:1.8;color:var(--text)">${day.staff.split('\n').filter(l=>l.trim()).map(l=>'• '+l).join('<br>')}</div>
    </div>`;
  }

  html+='</div>';
  el.innerHTML=html;
}

function toggleTask(idx){
  if(!db.day||!db.day.tasks) return;
  db.day.tasks[idx].done=!db.day.tasks[idx].done;
  save();renderDay();
}

function openDayEdit(){
  const day=db.day||{};
  const el=document.getElementById('sheet-content');

  // בנה שדות כמויות
  let qtyFields=DAY_CATS.map(c=>`
    <div style="display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border2)">
      <span style="font-size:13px;font-weight:600">${c.label}</span>
      <input type="number" id="qty-${c.key}" min="0" max="99" value="${(day.quantities||{})[c.key]||''}"
        style="width:60px;padding:6px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;text-align:center;font-family:Heebo,sans-serif;background:var(--bg);color:var(--text)">
    </div>`).join('');

  const stationsList=['מטיס 1','מטיס 2','מטיס 3','לוס','מטווח 3','מטווח 8','גבעת הלוס','לשביה'];
  const selStations=day.stations||[];
  let staBtns=stationsList.map(s=>`
    <button class="person-btn${selStations.includes(s)?' on':''}" onclick="toggleStationSel('${escId(s)}',this)">${s}</button>
  `).join('');

  el.innerHTML=`
    <div class="sheet-title">הגדרת יום</div>

    <span class="slabel">תאריך ושם היום</span>
    <input class="person-other" id="day-date" placeholder="למשל: יום חמישי 15.5.26" value="${day.date||''}">

    <span class="slabel">שעת הגעה</span>
    <input class="person-other" id="day-arrival" placeholder="למשל: 08:00" value="${day.arrivalTime||''}">

    <span class="slabel">עמדות פעילות</span>
    <div class="person-grid" id="sta-grid">${staBtns}</div>

    <span class="slabel">כמויות מכולה אדומה</span>
    <div style="margin-bottom:14px">${qtyFields}</div>

    <span class="slabel">משימות בוקר (שורה אחת = משימה אחת)</span>
    <textarea class="notes" id="day-tasks" style="height:120px" placeholder="זיכוי מגורים&#10;השלמת פערים בקפה&#10;פתיחת חד&quot;ן">${(day.tasks||[]).map(t=>t.text).join('\n')}</textarea>

    <span class="slabel">כוח אדם</span>
    <textarea class="notes" id="day-staff" style="height:80px" placeholder="אליקים - מנשה + בר + שגיא&#10;לכיש - אוריאל + שרון">${day.staff||''}</textarea>

    <span class="slabel">כיתות</span>
    <textarea class="notes" id="day-classes" style="height:80px" placeholder="חד&quot;ן בל&quot;ר - עין הבשור&#10;אודיטוריום - מטיס מבצעי">${day.classes||''}</textarea>

    <span class="slabel">הערות מיוחדות</span>
    <input class="person-other" id="day-notes" placeholder='למשל: שקשוקה של דורית ב-12:00' value="${day.notes||''}">

    <button class="next-btn" onclick="saveDayEdit()">שמור</button>
    <button class="back-btn" onclick="closeSheet()">ביטול</button>
  `;
  document.getElementById('sheet-bg').classList.add('on');
}

function toggleStationSel(name, btn){
  if(!db.day) db.day={};
  if(!db.day.stations) db.day.stations=[];
  const idx=db.day.stations.indexOf(name);
  if(idx>=0){ db.day.stations.splice(idx,1); btn.classList.remove('on'); }
  else { db.day.stations.push(name); btn.classList.add('on'); }
}

function saveDayEdit(){
  if(!db.day) db.day={};
  db.day.date=document.getElementById('day-date').value.trim();
  db.day.arrivalTime=document.getElementById('day-arrival').value.trim();
  const qty={};
  DAY_CATS.forEach(function(c){
    const v=parseInt(document.getElementById('qty-'+c.key).value)||0;
    if(v) qty[c.key]=v;
  });
  db.day.quantities=qty;
  db.day.staff=(document.getElementById('day-staff')||{}).value||'';
  db.day.classes=(document.getElementById('day-classes')||{}).value||'';
  db.day.notes=(document.getElementById('day-notes')||{}).value||'';
  const tasksRaw=document.getElementById('day-tasks').value;
  const existing=db.day.tasks||[];
  db.day.tasks=tasksRaw.split('\n').filter(t=>t.trim()).map(function(text){
    const prev=existing.find(function(e){return e.text===text.trim();});
    return {text:text.trim(), done:prev?prev.done:false};
  });
  save();renderDay();closeSheet();
}

load();
if(checkAuth()){
  renderAll();
  initFirebase();
}
document.getElementById('sheet-bg').addEventListener('click', function(e){
  if(e.target===this) closeSheet();
});
</script>
</body>
</html>
